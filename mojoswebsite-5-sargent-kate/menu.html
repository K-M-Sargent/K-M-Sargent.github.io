<!DOCTYPE html>
<html>
    <head>
        <meta charset=“utf-8“/>
        <title></title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="topmarg" style="background-color:rgb(194, 162, 224); height:150px;">
            <img src="images/logo.png" alt="" style="width:90px; margin:auto; float:left;">
            <h1 style="float:left;">"Coffee for a Cause"</h1>
            <img src="images/heart.png" alt="" style="width:90px; margin:auto; float:left;">
            <button style="float:right;">Sign up/log in</button>
            <div style="width:100%;" id="navbar">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="order.html">Order</a>
                <a href="menu.html">Menu</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
        <div id="mainbody" style="background-color:rgb(234, 191, 201); width: 100%;">
            <div id="slider" class="carousel slide" style="width:80%; background-color:rgb(234, 191, 201); margin:auto; padding-top: 10px; text-align:center;">
                <h3>Our Menu</h3>
                    <div class="carousel-indicators">
                      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner">
                      <div class="carousel-item active">
                        <img src="images/menu.png" class="d-block w-100" alt="...">
                      </div>
                      <div class="carousel-item">
                        <img src="images/foodmenu.png" class="d-block w-100" alt="...">
                      </div>
                      <div class="carousel-item">
                        <img src="images/signaturemenu.png" class="d-block w-100" alt="...">
                      </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                      <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      <span class="visually-hidden">Next</span>
                    </button>
                </div>
                <h5 style="padding-top:20px; text-align:center; width:80%; padding-bottom: 15px;;">We have many items on our menu, and will try to adjust to any health issues you may have (if possible to do so)!</h5>
            </div>
        </div>
        <div id="footer" style="background-color:rgb(194, 162, 224);">
            <a>Home</a>
            <a>About Us</a>
            <a>Order</a>
            <a>Menu</a>
            <a>Contact</a>
        </div>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
